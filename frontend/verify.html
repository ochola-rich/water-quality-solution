<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Reports - Guardians of the Lake</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700&family=JetBrains+Mono:wght@500;600&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f8f9ff] text-[#0d1c2e] font-sans flex min-h-screen">

  <!-- Sidebar -->
  <aside class="w-64 bg-white border-r border-[#eff4ff] p-6 flex flex-col fixed h-full z-20">
    <div class="flex items-center gap-3 mb-8">
      <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuCFLzIXN4YEg1liRFpmCKfUOleFO8FERzweularOMX9Z-rwpaZlsDvSET674m3bPlapj4Odtzgoir_bZDsLHnJDAZNYhf92EqarjkHX0zdKccBf_khRxTn3ZFutCl7qcRQb2e7GayQE0YwFycqmgKRIaHwOKUBeIC-2-arYKtavuzi_d2Qo7ZmeGnODC2X0To-Tas2QMz7w-pypp0n1r2dlbMNFqBAZij96Px4n3OAZEi-9mwX1Vti3Fg" alt="Logo" class="w-10 h-10 rounded" />
      <div>
        <h1 class="font-bold text-sm text-[#002546]">Guardians of the Lake</h1>
        <p class="font-mono text-xs text-[#737780]">Environmental Intelligence</p>
      </div>
    </div>

    <nav class="flex flex-col gap-2 flex-1 font-mono text-sm">
      <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded text-[#42474f] hover:bg-[#eff4ff]">
        <span class="material-symbols-outlined">dashboard</span> Overview
      </a>
      <a href="verify.html" class="flex items-center gap-3 px-3 py-2.5 rounded bg-[#dce9ff] text-[#002546] font-bold border-r-4 border-[#002546]">
        <span class="material-symbols-outlined">fact_check</span> Verify Reports
      </a>
    </nav>
  </aside>

  <!-- Main View -->
  <main class="flex-1 ml-64 p-8 max-w-7xl mx-auto w-full space-y-6">
    <div>
      <h2 class="text-3xl font-bold text-[#002546]">Verify Reports</h2>
      <p class="text-sm text-[#42474f]">Review community and station field submissions for water quality assurance.</p>
    </div>

    <!-- Filter Buttons -->
    <div class="flex gap-2">
      <button data-filter="all" class="bg-[#002546] text-white px-4 py-1.5 rounded-full font-mono text-xs font-bold cursor-pointer">All</button>
      <button data-filter="unverified" class="bg-[#eff4ff] text-[#002546] hover:bg-[#dce9ff] px-4 py-1.5 rounded-full font-mono text-xs font-bold cursor-pointer">Unverified</button>
      <button data-filter="verified" class="bg-[#eff4ff] text-[#002546] hover:bg-[#dce9ff] px-4 py-1.5 rounded-full font-mono text-xs font-bold cursor-pointer">Verified</button>
    </div>

    <!-- Split Review Grid -->
    <div class="grid grid-cols-12 gap-6">
      <div id="reports-feed-list" class="col-span-7 space-y-4"></div>
      <div id="inspection-workbench" class="col-span-5 sticky top-8"></div>
    </div>
  </main>

  <script src="js/verify.js"></script>
</body>
</html>
