<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guardians of the Lake - Report</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  

  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="container">
      <a href="/" class="navbar-brand">
        <span class="brand-icon">🌊</span>
        Tembo
      </a>
      
      <button class="nav-toggle" aria-label="Toggle navigation" id="navToggle">
        <i class="fas fa-bars"></i>
      </button>
      
      <div class="navbar-links" id="navLinks">
        <a href="/" class="nav-link active">
          <i class="fas fa-camera"></i> Report
        </a>
        <a href="/verify.html" class="nav-link">
          <i class="fas fa-check-circle"></i> Verify
        </a>
        <a href="/dashboard.html" class="nav-link">
          <i class="fas fa-chart-pie"></i> Dashboard
        </a>
      </div>
    </div>
  </nav>
  
  <!-- Offline Banner (hidden by default, shown by offline-queue.js) -->
  <div class="offline-banner" id="offlineBanner">
    <i class="fas fa-wifi"></i>
    <span id="offlineMessage">You are offline — reports will be queued</span>
    <span class="sync-progress" id="syncProgress"></span>
  </div>
  
  <!-- Main Content -->
  <main>
    <section class="section">
      <div class="container">
        <h1>🌊 Report Water Pollution</h1>
        <p class="text-muted">
          Help protect Lake Victoria. Take a photo, pin the location, and tell us what you see.
        </p>
        
        <div id="reportFormContainer">
        </div>
        
        <div id="reportStatus" style="display: none;">
        </div>
      </div>
    </section>
  </main>
  
  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>
        🌊 Guardians of the Lake — Zone01 Kisumu GreenTech Hackathon 2026
      </p>
      <p style="font-size: 0.8rem; opacity: 0.7;">
        Built with ❤️ for Lake Victoria
      </p>
    </div>
  </footer>
  
  <!-- JavaScript -->
  <!-- Shared modules -->
  <script type="module" src="/js/api.js"></script>
  <script type="module" src="/js/ws-client.js"></script>
  <script type="module" src="/js/offline-queue.js"></script>
  <script type="module" src="/js/ai-classifier.js"></script>
  
  <!-- Page-specific -->
  <script type="module" src="/js/report.js"></script>
  
  <script>
    // Mobile nav toggle
    document.getElementById('navToggle').addEventListener('click', function() {
      document.getElementById('navLinks').classList.toggle('open');
    });
  </script>
</body>
</html>
